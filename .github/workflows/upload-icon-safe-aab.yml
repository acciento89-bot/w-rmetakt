name: Upload icon-safe AAB to Google Play

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-icon-safe-aab.yml'

permissions:
  contents: read
  id-token: write

env:
  PACKAGE_NAME: de.kamilunavo.waermetakt
  EXPECTED_VERSION_CODE: '4'
  EXPECTED_UPLOAD_SHA256: FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - name: Verify icon identity
        run: |
          node - <<'NODE'
          const a=require('./app.json').expo;
          if(a.android.package!=='de.kamilunavo.waermetakt'||a.android.versionCode!==4) process.exit(1);
          if(a.icon!==a.splash?.image) throw new Error('Splash must match app icon');
          if(a.android?.adaptiveIcon?.backgroundImage) throw new Error('Adaptive launcher must not compose a second full icon');
          NODE
          cmp -s assets/icon-source.svg store/google-play/icon.svg
      - name: Recreate and verify the original Play upload signer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --no-install
          KEYSTORE='android/app/debug.keystore'
          test -s "$KEYSTORE"
          fp=$(keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android -keypass android | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':')
          test "$fp" = "$EXPECTED_UPLOAD_SHA256"
          echo "Recovered original WärmeTakt Play upload signer: $fp"
      - name: Build original-signer icon-safe release AAB
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          ./android/gradlew -p android bundleRelease
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          jarsigner -verify "$AAB" | grep -Fq 'jar verified.'
          aab_fp=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':')
          test "$aab_fp" = "$EXPECTED_UPLOAD_SHA256"
          echo "AAB signer verified: $aab_fp"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Upload and verify Play bundle
        env: {TOKEN: '${{ steps.google-auth.outputs.access_token }}'}
        shell: bash
        run: |
          set -euo pipefail
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          upload='https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          edit=''
          fresh=''
          cleanup() {
            if [ -n "$edit" ]; then curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit" >/dev/null || true; fi
            if [ -n "$fresh" ]; then curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$fresh" >/dev/null || true; fi
          }
          trap cleanup EXIT
          edit=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -er '.id')
          bundles=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit/bundles")
          if jq -e --argjson code "$EXPECTED_VERSION_CODE" '(.bundles // []) | any(.versionCode == $code)' <<<"$bundles" >/dev/null; then
            echo "$PACKAGE_NAME versionCode $EXPECTED_VERSION_CODE already exists in Google Play"
            exit 0
          fi
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/octet-stream' --data-binary "@$AAB_PATH" "$upload/applications/$PACKAGE_NAME/edits/$edit/bundles?uploadType=media")
          if [[ "$status" != 200 ]]; then cat "$body" >&2; exit 1; fi
          test "$(jq -r '.versionCode' "$body")" = "$EXPECTED_VERSION_CODE"
          commit_body=$(mktemp)
          status=$(curl -sS -o "$commit_body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits/$edit:commit")
          if [[ "$status" != 2* ]] && grep -Fq 'changesNotSentForReview' "$commit_body"; then
            status=$(curl -sS -o "$commit_body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits/$edit:commit?changesNotSentForReview=true")
          fi
          if [[ "$status" != 2* ]]; then cat "$commit_body" >&2; exit 1; fi
          edit=''
          fresh=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -er '.id')
          curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$fresh/bundles" | jq -e --argjson code "$EXPECTED_VERSION_CODE" '(.bundles // []) | any(.versionCode == $code)' >/dev/null
          echo "$PACKAGE_NAME versionCode $EXPECTED_VERSION_CODE uploaded and verified"
      - name: Remove generated signing material
        if: always()
        shell: bash
        run: rm -rf android
