name: Android central-signed bundle
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/android-central-bundle.yml
permissions:
  contents: read
concurrency:
  group: android-central-bundle
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'acciento89-bot/w-rmetakt'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      APP_ID: w-rmetakt
      PACKAGE_NAME: de.kamilunavo.waermetakt
      EXPECTED_VERSION_CODE: '4'
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Verify immutable reusable release artifact
      run: |-
        set -euo pipefail
        gh api repos/acciento89-bot/w-rmetakt/actions/artifacts/10320670098 > "$RUNNER_TEMP/source-artifact.json"
        jq -e '.id == 10320670098 and .name == "waermetakt-1.0.2-4-android-release" and .expired == false and .workflow_run.id == 34763985840 and .workflow_run.head_sha == "593f2af5e346ea115e004462da581e36919a0509"' "$RUNNER_TEMP/source-artifact.json" >/dev/null
        gh api repos/acciento89-bot/w-rmetakt/actions/runs/34763985840 > "$RUNNER_TEMP/source-run.json"
        jq -e '.conclusion == "success" and .head_branch == "main" and .head_sha == "593f2af5e346ea115e004462da581e36919a0509"' "$RUNNER_TEMP/source-run.json" >/dev/null
        git fetch --no-tags --depth=1 origin 593f2af5e346ea115e004462da581e36919a0509
        git diff --name-only 593f2af5e346ea115e004462da581e36919a0509 HEAD -- . ':!store/google-play/screenshots/**' ':!.github/workflows/android-central-bundle.yml' > "$RUNNER_TEMP/source-diff.txt"
        test ! -s "$RUNNER_TEMP/source-diff.txt"
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        artifact-ids: '10320670098'
        repository: acciento89-bot/w-rmetakt
        run-id: 34763985840
        github-token: ${{ github.token }}
        path: reused
        merge-multiple: true
    - name: Stage bundle for isolated signing
      run: |-
        set -euo pipefail
        mapfile -t found < <(find reused -type f -name "*.aab")
        test "${#found[@]}" -eq 1
        AAB="${found[0]}"
        test -s "$AAB"
        mkdir -p unsigned
        cp "$AAB" unsigned/app.aab
        printf '%s\n' "$GITHUB_SHA" > unsigned/source-commit.txt
    - uses: actions/upload-artifact@v4
      with:
        name: central-input-w-rmetakt-${{ github.run_id }}
        path: unsigned/
        if-no-files-found: error
        retention-days: 1
  sign:
    if: github.ref == 'refs/heads/main' && github.repository == 'acciento89-bot/w-rmetakt'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      APP_ID: w-rmetakt
      PACKAGE_NAME: de.kamilunavo.waermetakt
      EXPECTED_VERSION_CODE: '4'
    steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v4
      with:
        name: central-input-w-rmetakt-${{ github.run_id }}
        path: input
    - name: Validate bundle identity before restoring signing material
      run: |-
        set -euo pipefail
        test "$(cat input/source-commit.txt)" = "$GITHUB_SHA"
        test -s input/app.aab
        curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
        java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=input/app.aab
        package=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=input/app.aab --xpath='/manifest/@package')
        code=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=input/app.aab --xpath='/manifest/@android:versionCode')
        test "$package" = "$PACKAGE_NAME"
        test "$code" = "$EXPECTED_VERSION_CODE"
        mkdir -p signed
        python3 - <<'PY'
        import zipfile
        with zipfile.ZipFile('input/app.aab') as src, zipfile.ZipFile('signed/app.aab','w') as out:
            names=src.namelist()
            assert len(names)==len(set(names)), 'Duplicate ZIP entries'
            for item in src.infolist():
                upper=item.filename.upper()
                leaf=upper.removeprefix('META-INF/')
                if upper.startswith('META-INF/') and '/' not in leaf and (leaf=='MANIFEST.MF' or leaf.endswith(('.SF','.RSA','.DSA','.EC')) or leaf.startswith('SIG-')):
                    continue
                out.writestr(item,src.read(item))
        PY
    - name: Restore verified central upload identity
      uses: acciento89-bot/maengelfix/.github/actions/restore-central-android-signing@main
    - name: Sign and independently verify central release bundle
      run: |-
        set -euo pipefail
        expected='BCF2337D41E617C03BCAE698C09D1523654BD790'
        test "$KAMILUNAVO_CENTRAL_UPLOAD_SHA1" = "$expected"
        jarsigner -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" -storetype PKCS12 -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD -keypass:env ANDROID_UPLOAD_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 signed/app.aab "$ANDROID_UPLOAD_KEY_ALIAS"
        jarsigner -verify signed/app.aab > "$RUNNER_TEMP/verification.txt"
        grep -Fq 'jar verified.' "$RUNNER_TEMP/verification.txt"
        keytool -J-Duser.language=en -printcert -jarfile signed/app.aab > "$RUNNER_TEMP/certificate.txt"
        actual=$(sed -n 's/^[[:space:]]*SHA1: //p' "$RUNNER_TEMP/certificate.txt" | tr -d ':\r\n ')
        test "$actual" = "$expected"
        java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=signed/app.aab
        test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=signed/app.aab --xpath='/manifest/@package')" = "$PACKAGE_NAME"
        test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=signed/app.aab --xpath='/manifest/@android:versionCode')" = "$EXPECTED_VERSION_CODE"
        filename="$APP_ID-v$EXPECTED_VERSION_CODE-central.aab"
        mv signed/app.aab "signed/$filename"
        (cd signed && sha256sum "$filename" > "$filename.sha256")
        jq -n --arg package "$PACKAGE_NAME" --argjson versionCode "$EXPECTED_VERSION_CODE" --arg certificateSha1 "$actual" --arg sourceCommit "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{package:$package,versionCode:$versionCode,certificateSha1:$certificateSha1,sourceCommit:$sourceCommit,runId:$runId}' > signed/release-evidence.json
        printf '%s versionCode %s central-signed and verified. No Play changes.\n' "$PACKAGE_NAME" "$EXPECTED_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
    - name: Destroy restored signing material
      if: always()
      run: |-
        rm -f "$RUNNER_TEMP/kamilunavo-central-upload.p12"
        rm -rf "$RUNNER_TEMP/kamilunavo-central-signing"
    - name: Preserve verified release bundle
      uses: actions/upload-artifact@v4
      with:
        name: w-rmetakt-v4-central-signed-aab
        path: signed/
        if-no-files-found: error
        retention-days: 30
