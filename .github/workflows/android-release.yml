name: WärmeTakt Android Release

on:
  pull_request:
    paths:
      - "App.tsx"
      - "app.json"
      - "eas.json"
      - "src/**"
      - "assets/**"
      - "store/google-play/**"
      - "package*.json"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "eas.json"
      - "src/**"
      - "assets/**"
      - "store/google-play/**"
      - "package*.json"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      build_bundle:
        description: Build one Android candidate from verified main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/*.test.mjs
      - name: Validate Play identity and launch icon configuration
        run: |
          set -euo pipefail
          node - <<'NODE'
          const a=require('./app.json').expo;
          if(a.android.package!=='de.kamilunavo.waermetakt'||a.android.versionCode!==5||a.version!=='1.1.0') process.exit(1);
          if(a.icon!==a.splash?.image) throw new Error('WärmeTakt splash image must match expo.icon');
          if(a.android.adaptiveIcon!==undefined) throw new Error('Adaptive launcher variants must remain disabled');
          NODE
          test ! -e assets/android-icon-foreground.png
          test ! -e assets/android-icon-background.png
          test ! -e assets/android-icon-monochrome.png
          test ! -e assets/icon-foreground-source.svg
          test ! -e assets/icon-monochrome-source.svg
          cmp -s assets/icon-source.svg store/google-play/icon.svg
          ! grep -R -E -i "webview|loadurl|localhost" App.tsx src
      - name: Install icon validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          python3 -m pip install --disable-pip-version-check -q pillow
      - name: Verify raster launcher and render canonical Play icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/icon-check" play-assets
          rsvg-convert -w 1024 -h 1024 assets/icon-source.svg -o "$RUNNER_TEMP/icon-check/full.png"
          rsvg-convert -w 512 -h 512 store/google-play/icon.svg -o play-assets/icon-512.png
          python3 - <<'PY'
          from PIL import Image, ImageChops
          checks=[
              ('assets/icon.png', 'FULL_ICON'),
          ]
          rendered={
              'FULL_ICON':'/tmp/none',
          }
          import os
          root=os.environ['RUNNER_TEMP']+'/icon-check'
          rendered['FULL_ICON']=root+'/full.png'
          for stored,label in checks:
              with Image.open(stored) as a, Image.open(rendered[label]) as b:
                  a.load(); b.load()
                  if a.size != b.size:
                      raise SystemExit(f'{stored}: size {a.size} != {b.size}')
                  if ImageChops.difference(a.convert('RGBA'), b.convert('RGBA')).getbbox() is not None:
                      raise SystemExit(f'{stored}: pixels differ from canonical {label.lower()} source')
          with Image.open('play-assets/icon-512.png') as im:
              if im.size != (512,512):
                  raise SystemExit(f'Play icon has invalid size {im.size}')
          if os.path.getsize('play-assets/icon-512.png') >= 1024*1024:
              raise SystemExit('Play icon exceeds 1 MiB')
          print('WärmeTakt launcher/store identity parity OK')
          PY
          sha256sum play-assets/icon-512.png > play-assets/icon-512.png.sha256
  bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.build_bundle && github.ref == 'refs/heads/main' && github.repository == 'acciento89-bot/w-rmetakt'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build one exact Android candidate
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon --max-workers=1 bundleRelease
          mkdir candidate
          cp android/app/build/outputs/bundle/release/app-release.aab candidate/app-release.aab
          printf '%s\n' "$GITHUB_SHA" > candidate/source-commit.txt
          (cd candidate && sha256sum app-release.aab > app-release.aab.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: waermetakt-1.1.0-5-android-release
          path: candidate/
          if-no-files-found: error
          retention-days: 30
