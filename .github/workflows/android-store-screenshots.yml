name: WärmeTakt Android Store Screenshots

on:
  pull_request:
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'src/**'
      - 'assets/**'
      - 'package*.json'
      - '.github/scripts/capture-android-store-screenshots.sh'
      - '.github/workflows/android-store-screenshots.yml'
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'src/**'
      - 'assets/**'
      - 'package*.json'
      - '.github/scripts/capture-android-store-screenshots.sh'
      - '.github/workflows/android-store-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck
      - name: Generate and build current Android app
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          npx expo prebuild --platform android --no-install
          ./android/gradlew -p android assembleDebug
      - name: Capture real Expo UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: PACKAGE_NAME='de.kamilunavo.waermetakt' APK_PATH='android/app/build/outputs/apk/debug/app-debug.apk' OUTPUT_DIR='store/google-play/screenshots/de-DE' SECOND_ACTION='swipe' bash "$GITHUB_WORKSPACE/.github/scripts/capture-android-store-screenshots.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: WaermeTakt-authentic-Android-store-screenshots
          path: store/google-play/screenshots/de-DE/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Persist verified emulator screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store/google-play/screenshots/de-DE
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'store(android): refresh authentic WärmeTakt screenshots'
          git push
