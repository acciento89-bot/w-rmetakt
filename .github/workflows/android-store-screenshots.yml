name: WärmeTakt Android Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run typecheck
      - name: Generate and build current Android app
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          npx expo prebuild --platform android --no-install
          ./android/gradlew -p android assembleRelease
      - name: Enable KVM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Capture real Expo UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: PACKAGE_NAME='de.kamilunavo.waermetakt' APK_PATH='android/app/build/outputs/apk/release/app-release.apk' OUTPUT_DIR='store/google-play/screenshots/de-DE' SECOND_ACTION='swipe' bash "$GITHUB_WORKSPACE/.github/scripts/capture-android-store-screenshots.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: WaermeTakt-authentic-Android-store-screenshots
          path: store/google-play/screenshots/de-DE/*.png
          if-no-files-found: error
          retention-days: 30
